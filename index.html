<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BO Target Monitor</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#b3261e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="xlsx.full.min.js"></script>
<style>
:root{--ink:#1f2328;--mut:#6b6f76;--bg:#faf9f7;--card:#fff;--ln:#e3dfd8;--ac:#b3261e;--ok:#1e7b4f;--bar:#ece8e1}
@media(prefers-color-scheme:dark){:root{--ink:#ece9e4;--mut:#9a9da3;--bg:#17181a;--card:#222426;--ln:#35373a;--ac:#e5594f;--ok:#4cc38a;--bar:#303236}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
header{background:var(--ac);color:#fff;padding:12px 14px}
header b{font-size:17px;display:block}header span{font-size:12px;opacity:.85}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}
nav button{flex:0 0 auto;white-space:nowrap;border:0;background:none;color:var(--mut);padding:8px 12px;font:inherit;border-radius:8px}
nav button.on{background:var(--ac);color:#fff}
main{padding:12px;max-width:720px;margin:auto}
section{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:15px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:6px}
input,select,textarea,button.b{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px;margin-top:2px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
button.b{background:var(--ac);color:#fff;border:0;text-align:center;cursor:pointer;margin-top:8px}
button.b.s{background:var(--bg);color:var(--ink);border:1px solid var(--ln)}
button.x{width:auto;background:none;border:0;color:var(--ac);font-size:20px;padding:0 6px;cursor:pointer}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
details{border:1px solid var(--ln);border-radius:8px;padding:8px;margin-bottom:8px}
summary{cursor:pointer;font-weight:600}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:10px;font:12.5px/1.5 ui-monospace,Menlo,monospace;max-height:340px;overflow:auto}
.bar{height:8px;background:var(--bar);border-radius:4px;margin-top:4px}.bar i{display:block;height:8px;border-radius:4px;background:var(--ac)}
.bar.done i{background:var(--ok)}
.sm{font-size:12px;color:var(--mut)}.ok{color:var(--ok)}.er{color:var(--ac)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cd{border:1px solid var(--ln);border-radius:8px;padding:8px}.cd b{font-size:17px;display:block}
a.lk{display:inline-block;padding:8px 14px;border-radius:8px;background:var(--ac);color:#fff;text-decoration:none;margin-right:8px}
a.lk.s{background:var(--ok)}
#m{position:fixed;left:12px;right:12px;bottom:12px;background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:8px;display:none;z-index:9;font-size:14px}
</style></head><body>
<header><b>BO Target Monitor</b><span id="sd"></span></header>
<nav id="nav"></nav><main id="app"></main><div id="m"></div>
<script>
var VER='2026.10.18-c',K='bom_v1',TABS=['Setup','Visit','Daily','Report','Dashboard'],tab=0,S;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(n){return Math.round(n||0).toLocaleString('en-IN')}
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x}
function dm(s){return s.split('-').reverse().join('/')}
function msg(t,bad){var e=$('m');e.textContent=t;e.style.display='block';e.style.background=bad?'#b3261e':'';e.style.color=bad?'#fff':'';clearTimeout(msg.t);msg.t=setTimeout(function(){e.style.display='none'},3200)}
function def(){var n=new Date();return{name:'Sub Division',cats:['Mail','International Mail','POSB Accounts','PLI/RPLI Premium','CCS'].map(function(c,i){return{id:'c'+i,n:c}}),
per:[{f:iso(new Date(n.getFullYear(),n.getMonth(),1)),t:iso(new Date(n.getFullYear(),n.getMonth()+1,0)),tg:{c2:{c:10,a:0},c3:{c:0,a:3500}}}],
bos:[],mem:[],E:{},V:{},imp:[],me:'',d:iso(n),pi:0,vb:'',dc:'all',ml:15,vw:3,vn:{},pk:''}}
function load(){try{var j=JSON.parse(localStorage.getItem(K));if(j){var r=Object.assign(def(),j);r.d=iso(new Date());return r}}catch(e){}return def()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){msg('Could not save on this device',1)}}
S=load();
function P(d){return S.per.filter(function(p){return d>=p.f&&d<=p.t})[0]||S.per[0]}
function tgOf(p,c){return p.tg[c]||{c:0,a:0}}
function ent(b,d){return S.E[b+'|'+d]}
function gE(b,d){var k=b+'|'+d;return S.E[k]||(S.E[k]={cats:{},lg:0,lc:0,dk:0})}
function cv(e,c){return(e&&e.cats&&e.cats[c])||{c:0,a:0}}
function mine(){return S.bos.filter(function(b){return b.own==S.me})}
function agg(bs,f,t){var r={cats:{},lg:0,lc:0,dk:0};S.cats.forEach(function(c){r.cats[c.id]={c:0,a:0}});
for(var k in S.E){var q=k.split('|');if(q[1]<f||q[1]>t||bs.indexOf(q[0])<0)continue;var e=S.E[k];
S.cats.forEach(function(c){var x=cv(e,c.id);r.cats[c.id].c+=x.c;r.cats[c.id].a+=x.a});r.lg+=e.lg||0;r.lc+=e.lc||0;r.dk+=e.dk||0}return r}
function names(a){return a.map(function(b){return b.n})}

/* ---------- navigation ---------- */
function R0(){$('sd').textContent=S.name;
$('nav').innerHTML=TABS.map(function(t,i){return'<button class="'+(i==tab?'on':'')+'" onclick="tab='+i+';R();scrollTo(0,0)">'+t+'</button>'}).join('');
if(!S.me&&S.mem.length)S.me=S.mem[0].n;
$('app').innerHTML=[vSetup,vVisit,vDaily,vReport,vDash][tab]()}
function ctx(){return'<section><div class="g"><label>I am<select data-k="s:me">'+(S.mem.map(function(m){return'<option'+(m.n==S.me?' selected':'')+'>'+esc(m.n)+'</option>'}).join('')||'<option>No team yet</option>')+'</select></label><label>Date<input type="date" data-k="s:d" value="'+S.d+'"></label></div></section>'}
function inp(k,v,t,ph){return'<input '+(t||'type="number" min="0" inputmode="decimal"')+' data-k="'+k+'" value="'+esc(v||'')+'" '+(ph?'placeholder="'+ph+'"':'')+'>'}

/* ---------- setup ---------- */
function vSetup(){var p=S.per[S.pi],h='';
h+='<section><h3>Sub division</h3><label>Name'+inp('g:name',S.name,'type="text"')+'</label><label>Minimum leads ready per visit BO'+inp('g:ml',S.ml)+'</label></section>';
h+='<section><h3>Team</h3>'+S.mem.map(function(m,i){return'<div class="row"><span>'+esc(m.n)+' <span class="sm">'+m.r+'</span></span><button class="x" onclick="delMem('+i+')">&times;</button></div>'}).join('')+
'<div class="g3" style="margin-top:6px"><label style="grid-column:1/3">Name<input id="mn" type="text"></label><label>Role<select id="mr"><option>MO</option><option>ME</option><option>OA</option></select></label></div><button class="b s" onclick="addMem()">Add team member</button></section>';
h+='<section><h3>Categories</h3><div class="sm">Every category tracks Count and Amount.</div>'+S.cats.map(function(c){return'<div class="row">'+inp('cat:'+c.id,c.n,'type="text"')+'<button class="x" onclick="delCat(\''+c.id+'\')">&times;</button></div>'}).join('')+
'<label>New category<input id="nc" type="text"></label><button class="b s" onclick="addCat()">Add category</button></section>';
h+='<section><h3>Target period</h3><label>Period<select data-k="s:pi">'+S.per.map(function(x,i){return'<option value="'+i+'"'+(i==S.pi?' selected':'')+'>'+dm(x.f)+' to '+dm(x.t)+'</option>'}).join('')+'</select></label>'+
'<div class="g"><label>From<input type="date" data-k="per:f" value="'+p.f+'"></label><label>To<input type="date" data-k="per:t" value="'+p.t+'"></label></div>'+
'<div class="sm">Target per BO for this period</div>'+S.cats.map(function(c){var t=tgOf(p,c.id);return'<div class="g"><label>'+esc(c.n)+' (count)'+inp('tg:'+c.id+':c',t.c)+'</label><label>Amount (Rs)'+inp('tg:'+c.id+':a',t.a)+'</label></div>'}).join('')+
'<button class="b s" onclick="addPer()">Add new period</button></section>';
h+='<section><h3>Branch offices ('+S.bos.length+')</h3><div class="sm">Excel columns: Name of HO/SO, Name of BO, Name of BPM, Mobile Number. Optional: Assigned To, Type (V = visit, M = monitor), Visit Date.</div>'+
'<input type="file" accept=".xlsx,.xls,.csv" onchange="xl(this)"><button class="b s" onclick="tpl()">Download Excel template</button>'+
'<div class="g" style="margin-top:8px"><label>BO name<input id="bn" type="text"></label><label>SO<input id="bs" type="text"></label><label>BPM<input id="bp" type="text"></label><label>Mobile<input id="bm" type="tel"></label></div><button class="b s" onclick="addBo()">Add BO manually</button>'+
'<details style="margin-top:10px"><summary>BO list, assignment and visit dates</summary>'+S.bos.map(function(b){var i=S.bos.indexOf(b);return'<div style="border-top:1px solid var(--ln);padding:6px 0"><div class="row"><b>'+esc(b.n)+'</b><button class="x" onclick="delBo('+i+')">&times;</button></div>'+bed(b)+'<div class="g3"><label>Owner<select data-k="bo:'+esc(b.n)+':own"><option value=""></option>'+S.mem.map(function(m){return'<option'+(m.n==b.own?' selected':'')+'>'+esc(m.n)+'</option>'}).join('')+'</select></label><label>Type<select data-k="bo:'+esc(b.n)+':ty"><option value="V"'+(b.ty=='V'?' selected':'')+'>Visit</option><option value="M"'+(b.ty!='V'?' selected':'')+'>Monitor</option></select></label><label>Visit date<input type="date" data-k="bo:'+esc(b.n)+':vd" value="'+(b.vd||'')+'"></label></div>'+ctg(b)+'</div>'}).join('')+'</details></section>';
h+=vSched();return h}
function addMem(){var n=$('mn').value.trim();if(!n)return msg('Enter a name',1);if(S.mem.some(function(m){return m.n==n}))return msg('Name already added',1);S.mem.push({n:n,r:$('mr').value});if(!S.me)S.me=n;save();R()}
function delMem(i){if(confirm('Remove '+S.mem[i].n+'?')){S.mem.splice(i,1);S.me=S.mem[0]?S.mem[0].n:'';save();R()}}
function addCat(){var n=$('nc').value.trim();if(!n)return msg('Enter a category name',1);S.cats.push({id:'c'+Date.now(),n:n});save();R()}
function delCat(id){if(confirm('Remove this category? Its entries stay saved but are hidden.')){S.cats=S.cats.filter(function(c){return c.id!=id});save();R()}}
function addPer(){var p=S.per[S.pi],t=JSON.parse(JSON.stringify(p.tg)),d=new Date(p.t+'T00:00:00');d.setDate(d.getDate()+1);
S.per.push({f:iso(d),t:iso(new Date(d.getFullYear(),d.getMonth()+1,0)),tg:t});S.pi=S.per.length-1;save();R();msg('New period added. Set its dates and targets.')}
function addBo(){var n=$('bn').value.trim().toUpperCase();if(!n)return msg('Enter BO name',1);
if(S.bos.some(function(b){return b.n==n}))return msg('BO already exists',1);S.bos.push({n:n,so:$('bs').value.trim(),bpm:$('bp').value.trim(),mob:$('bm').value.trim(),own:S.me,ty:'M',vd:''});save();R()}
function delBo(i){if(confirm('Remove '+S.bos[i].n+'?')){S.bos.splice(i,1);save();R()}}
function tpl(){var w=XLSX.utils.aoa_to_sheet([['Sr No','Name of HO/SO','Name of BO','Name of BPM','Mobile Number','Assigned To','Type (V/M)','Visit Date (DD/MM/YYYY)'],[1,'Example SO','EXAMPLE BO','BPM Name','9999999999','MO-1','V','12/10/2026']]),b=XLSX.utils.book_new();XLSX.utils.book_append_sheet(b,w,'BO List');XLSX.writeFile(b,'BO_List_Template.xlsx')}
function pd(v){if(!v)return'';if(typeof v=='number'){var o=XLSX.SSF.parse_date_code(v);return o?o.y+'-'+('0'+o.m).slice(-2)+'-'+('0'+o.d).slice(-2):''}
var m=String(v).trim().match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);return m?m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2):(/^\d{4}-\d{2}-\d{2}$/.test(String(v).trim())?String(v).trim():'')}
function xl(el){var f=el.files[0];if(!f)return;if(typeof XLSX=='undefined')return msg('Excel reader did not load. Check internet and reload.',1);var r=new FileReader();
r.onload=function(){try{var wb=XLSX.read(r.result,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}),re=/name of bo|^bo( name)?$/i,hi=-1,i;
for(i=0;i<rows.length;i++){if(rows[i].some(function(c){return re.test(String(c).trim())})){hi=i;break}}
if(hi<0)return msg('Header "Name of BO" not found',1);
var hd=rows[hi].map(function(c){return String(c).trim().toLowerCase()}),an=[];hd.forEach(function(h,j){if(re.test(h))an.push(j)});
var add=0,upd=0;
an.forEach(function(a,ai){var end=ai+1<an.length?an[ai+1]-3:hd.length-1,col={};
for(var j=Math.max(0,a-1);j<=end;j++){var h=hd[j];if(j==a)continue;if(/\bso\b/.test(h))col.so=j;else if(/bpm/.test(h))col.bpm=j;else if(/mobile|phone/.test(h))col.mob=j;else if(/assigned|owner/.test(h))col.own=j;else if(/^type/.test(h))col.ty=j;else if(/visit/.test(h))col.vd=j}
for(var r2=hi+1;r2<rows.length;r2++){var row=rows[r2],n=String(row[a]).trim().toUpperCase();if(!n)continue;
var g=function(k){return col[k]==null?'':String(row[col[k]]).trim()},o=S.bos.filter(function(b){return b.n==n})[0];
if(!o){o={n:n,so:'',bpm:'',mob:'',own:S.me,ty:'M',vd:''};S.bos.push(o);add++}else upd++;
if(g('so'))o.so=g('so');if(g('bpm'))o.bpm=g('bpm');if(g('mob'))o.mob=g('mob');
if(g('own'))o.own=g('own');if(g('ty'))o.ty=/^v/i.test(g('ty'))?'V':'M';if(col.vd!=null&&pd(row[col.vd]))o.vd=pd(row[col.vd]);
if(o.own&&!S.mem.some(function(m){return m.n==o.own})){S.mem.push({n:o.own,r:/^me/i.test(o.own)?'ME':/^oa/i.test(o.own)?'OA':'MO'})}}});
save();R();msg(add+' BO added, '+upd+' updated')}catch(e){msg('Could not read this file',1)}};r.readAsArrayBuffer(f)}

/* ---------- visit ---------- */
function catFields(b){var e=ent(b,S.d);return S.cats.map(function(c){var x=cv(e,c.id);return'<div class="g"><label>'+esc(c.n)+' (count)'+inp('e:'+b+':'+c.id+':c',x.c)+'</label><label>Amount (Rs)'+inp('e:'+b+':'+c.id+':a',x.a)+'</label></div>'}).join('')}
function extra(b){var e=ent(b,S.d)||{};return'<div class="g3"><label>Leads generated'+inp('x:'+b+':lg',e.lg)+'</label><label>Leads converted'+inp('x:'+b+':lc',e.lc)+'</label><label>Dak Sewa app'+inp('x:'+b+':dk',e.dk)+'</label></div>'}
function vVisit(){var bs=mine().filter(function(b){return b.ty=='V'}),h=ctx();
if(!bs.length)return h+'<section>No visit BO assigned to '+esc(S.me)+'. In Setup, set the BO type to Visit and the owner to this person.</section>';
var b=bs.filter(function(x){return x.n==S.vb})[0]||bs.filter(function(x){return x.vd==S.d})[0]||bs[0],v=S.V[b.n+'|'+S.d]||{};
h+='<section><h3>Visit entry</h3><label>Branch office<select data-k="s:vb">'+bs.map(function(x){return'<option value="'+esc(x.n)+'"'+(x.n==b.n?' selected':'')+'>'+esc(x.n)+(x.vd==S.d?' (scheduled today)':'')+(S.V[x.n+'|'+S.d]?' - done':'')+'</option>'}).join('')+'</select></label>'+
'<div class="g"><label>Arrival time'+inp('v:'+b.n+':arr',v.arr,'type="time"')+'</label><label>Departure time'+inp('v:'+b.n+':dep',v.dep,'type="time"')+'</label>'+
'<label>Lead Register<select data-k="v:'+esc(b.n)+':lr"><option>Prepared</option><option'+(v.lr=='Not prepared'?' selected':'')+'>Not prepared</option><option'+(v.lr=='Nil'?' selected':'')+'>Nil</option></select></label><label>Leads in register (min '+S.ml+')'+inp('v:'+b.n+':ln',v.ln)+'</label>'+
'<label style="grid-column:1/3">People met with BPM'+inp('v:'+b.n+':met',v.met)+'</label></div>'+
'<h3 style="margin-top:8px">Achievement today</h3>'+catFields(b.n)+extra(b.n)+'<label>Remarks'+inp('v:'+b.n+':rm',v.rm,'type="text"')+'</label>'+
'<div class="sm">BPM: '+esc(b.bpm)+' '+cl(b)+'</div>'+'<div class="sm ok" style="margin-top:6px">Entries save automatically.</div></section>';return h}

/* ---------- daily ---------- */
function vDaily(){var ot=mine().filter(function(b){return!S.V[b.n+'|'+S.d]}),h=ctx();
if(!ot.length)return h+'<section>No BO to enter. Assign BOs to '+esc(S.me)+' in Setup.</section>';
h+='<section><h3>Daily entry ('+ot.filter(function(b){return ent(b.n,S.d)}).length+'/'+ot.length+' done)</h3><div class="sm">BOs visited today are in the Visit tab.</div><div style="margin-top:8px">'+
ot.map(function(b){return'<details'+(S.dop==b.n?' open':'')+'><summary>'+esc(b.n)+(ent(b.n,S.d)?' <span class="ok">&#10003;</span>':'')+'</summary><div class="sm">BPM: '+esc(b.bpm)+' '+cl(b)+'</div>'+catFields(b.n)+extra(b.n)+'</details>'}).join('')+'</div></section>';return h}

/* ---------- reports ---------- */
function pad(s,n,r){s=String(s);if(s.length>=n)return s;var p=Array(n-s.length+1).join(' ');return r?p+s:s+p}
function cmp(n){n=Math.round(n||0);if(n>=1e7)return(n/1e7).toFixed(2).replace(/\.?0+$/,'')+'Cr';if(n>=1e5)return(n/1e5).toFixed(2).replace(/\.?0+$/,'')+'L';return fmt(n)}
function cn(c){var m={'POSB Accounts':'POSB A/c','PLI/RPLI Premium':'PLI/RPLI','International Mail':'Int Mail'};return(m[c.n]||c.n).slice(0,10)}
var LN='━━━━━━━━━━━━━━';
function tb(cols,rows,w){var o=[pad('Category',10)+cols.map(function(c){return pad(c,w,1)}).join('')];rows.forEach(function(r){o.push(pad(r[0],10)+r.slice(1).map(function(v){return pad(v,w,1)}).join(''))});return'```\n'+o.join('\n')+'\n```'}
var EQ='==========================',DL='--------------------------';
function dms(s){var q=s.split('-');return q[2]+'/'+q[1]+'/'+q[0].slice(2)}
function ck(n){n=Math.round(n||0);if(n>=1e7)return(n/1e7).toFixed(1).replace(/\.0$/,'')+'Cr';if(n>=1e5)return(n/1e5).toFixed(1).replace(/\.0$/,'')+'L';if(n>=1e4)return Math.round(n/1e3)+'K';if(n>=1000)return(n/1000).toFixed(1).replace(/\.0$/,'')+'K';return String(n)}
function kv(k,v){return pad(k,13)+': '+v}
function T2(h,rows,w,tot,lf){lf=lf||1;var f=function(r){return r.map(function(v,i){v=String(v);return i<lf?pad(v.slice(0,w[i]-1),w[i]):pad(v,w[i],1)}).join('')},n=w.reduce(function(a,b){return a+b},0),o=[f(h),Array(n+1).join('-')];rows.forEach(function(r){o.push(f(r))});if(tot){o.push(Array(n+1).join('-'));o.push(f(tot))}return o}
function blk(t,L){return'*'+t+'*\n```\n'+L.join('\n')+'\n```'}
function add(L,a){a.forEach(function(x){L.push(x)})}
function rep1(){var vb=mine().filter(function(b){return S.V[b.n+'|'+S.d]}),p=P(S.d),L=[S.name,S.me+' | '+dm(S.d),EQ];
if(!vb.length){L.push('No BO visited on this date.');return blk('DAILY VISIT REPORT',L)}
